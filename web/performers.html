    <main>
        <h1>Účinkující</h1>
        <section id="performers">
        </section>
        <script>
            async function loadAndTransform() {
                // Fetch XML from REST API (or static file)
                const [xmlRes, xslRes] = await Promise.all([
                    // fetch('https://your-api.com/products'),
                    fetch('./data/festival.xml'),
                    fetch('transform.xsl')
                ]);

                const xmlText = await xmlRes.text();
                const xslText = await xslRes.text();

                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'application/xml');
                const xslDoc = parser.parseFromString(xslText, 'application/xml');

                // Apply XSLT transform
                const processor = new XSLTProcessor();
                processor.importStylesheet(xslDoc);
                const resultFragment = processor.transformToFragment(xmlDoc, document);

                document.getElementById('performers').appendChild(resultFragment);
            }

            loadAndTransform();
        </script>
    </main>
